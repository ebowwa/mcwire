name: mcoracle
options:
  bundleIdPrefix: local.mcwire
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  mcoracle:
    type: application
    platform: iOS
    sources:
      - mcoracle
    info:
      path: mcoracle/Info.plist
      properties:
        CFBundleDisplayName: mcoracle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: >-
          mcoracle is a MultipeerConnectivity test oracle: it advertises and
          browses a Bonjour service on your local network so the mcwire
          foreign client can join its session.
        NSBonjourServices:
          - _secondsee-mpc._tcp
          - _mc-probe._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.mcwire.mcoracle
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM to your own (or pass signing overrides to
        # xcodebuild) — the committed project ships unassigned.
        ENABLE_PREVIEWS: false